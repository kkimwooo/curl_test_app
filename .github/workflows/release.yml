name: Build and Release macOS App

on:
  push:
    tags:
      - 'v*' # v1.0.0 등 'v'로 시작하는 태그가 푸시되었을 때 동작

permissions:
  contents: write # Release에 빌드된 파일을 업로드하기 위한 쓰기 권한 설정

jobs:
  build-macos:
    name: Build macOS Application
    runs-on: macos-latest

    steps:
      # 1. GitHub 저장소 소스코드 체크아웃
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Java 개발 환경 셋업 (일부 Flutter 액션 및 캐싱 호환성 대비)
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. Flutter 환경 구성 (stable 채널 사용)
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 4. 의존성 패키지 다운로드
      - name: Install dependencies
        run: flutter pub get

      # 5. Isar 어댑터 파일 생성을 위한 build_runner 실행
      - name: Run Build Runner
        run: dart run build_runner build --delete-conflicting-outputs

      # 6. macOS Release 빌드 (CI 환경이므로 코드사인 생략 옵션 추가)
      - name: Build macOS App
        run: flutter build macos --release --no-codesign

      # 7. 빌드 결과물(.app)을 배포용 zip 파일로 압축
      - name: Zip Release Artifact
        run: |
          cd build/macos/Build/Products/Release
          zip -r ../../../../levi_curl_test_app.zip levi_curl_test_app.app

      # 8. GitHub Release 생성 및 빌드된 zip 아티팩트 업로드
      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        with:
          files: levi_curl_test_app.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
